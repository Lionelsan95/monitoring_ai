name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: monitoring-ai

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dev deps
        run: uv sync --extra dev

      - name: Run ruff
        run: uv run ruff check src/ tests/

  # ── 2. Test ─────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Tests are fully offline — no LLM keys needed.
      # Domain ports are mocked; langchain-openai / anthropic not required.
      - name: Install dev deps
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest -v

  # ── 3. Build ────────────────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Push to ECR ──────────────────────────────────────────────────────────
  # Runs only on pushes to master/main AND when AWS credentials are configured.
  # Safe to skip: forks and PRs without secrets simply skip this job.
  push-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
        continue-on-error: true   # skip gracefully if secret is not set

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.aws-auth.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.aws-auth.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        if: steps.aws-auth.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'monitoring-ai' }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY || 'monitoring-ai' }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
