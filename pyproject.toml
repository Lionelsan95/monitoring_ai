[project]
name = "monitoring-ai"
version = "0.1.0"
description = "AI-powered infrastructure monitoring pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "langsmith>=0.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai    = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.3"]
ollama    = ["langchain-ollama>=0.2"]
bedrock   = ["langchain-aws>=0.2"]
ui        = ["streamlit>=1.35"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.4",
]
all = [
    "monitoring-ai[openai,anthropic,ollama,ui]",
]

[project.scripts]
monitoring-ai = "entrypoints.cli:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
