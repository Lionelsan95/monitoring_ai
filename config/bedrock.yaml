# ── AWS Bedrock configuration ─────────────────────────────────────────────────
# Used when running on ECS with an IAM task role.
# No API key required — the SDK picks up credentials from the task metadata endpoint.
#
# Model ID format — must be the full Bedrock identifier, NOT the friendly name:
#   Single-region:   anthropic.claude-3-5-sonnet-20241022-v2:0
#   Cross-region:    us.anthropic.claude-3-5-sonnet-20241022-v2:0
#
# Common model IDs:
#   anthropic.claude-3-5-sonnet-20241022-v2:0   Claude 3.5 Sonnet v2
#   anthropic.claude-3-haiku-20240307-v1:0      Claude 3 Haiku (fast + cheap)
#   amazon.titan-text-express-v1                Amazon Titan Express
#
# AWS_REGION env var controls which region is called (default: eu-west-1).
# Ensure the model is available in that region before deploying.

defaults:
  temperature: 0.2
  max_tokens: 2048

nodes:
  analysis:
    provider: bedrock
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    temperature: 0.2

  recommendation:
    provider: bedrock
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    temperature: 0.3
